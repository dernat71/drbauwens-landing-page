name: Déploiement o2switch

# Déploie le site sur docteurbauwens.be à chaque push sur main.
#
# Ce workflow n'implémente rien lui-même : il appelle les mêmes tâches que
# vous lancez en local (`task deploy`). Une seule implémentation du
# déploiement, donc ce qui est testé à la main est exactement ce qui tourne
# ici.
#
# Pourquoi FTPS et non SSH : chez o2switch le port 22 n'est ouvert qu'aux IP
# en liste blanche (5 maximum), incompatible avec des runners dont l'IP change
# à chaque exécution. Le port 21 est accessible sans restriction, et FTPS
# chiffre la connexion.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      simulation:
        description: "Simulation : montre ce qui serait envoyé, sans rien écrire"
        type: boolean
        default: false

concurrency:
  group: deploiement-production
  cancel-in-progress: false   # ne jamais interrompre un déploiement en cours

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    env:
      O2SWITCH_FTP_SERVER: ${{ secrets.O2SWITCH_FTP_SERVER }}
      O2SWITCH_FTP_USER: ${{ secrets.O2SWITCH_FTP_USER }}
      O2SWITCH_FTP_PASSWORD: ${{ secrets.O2SWITCH_FTP_PASSWORD }}
      O2SWITCH_FTP_DIR: ${{ secrets.O2SWITCH_FTP_DIR }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Vérifier les prérequis
        run: task doctor

      - name: Déployer
        run: task ${{ inputs.simulation && 'deploy:dry' || 'deploy' }}
